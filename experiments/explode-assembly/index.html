<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesla Model 3 Long Range — Exploded View</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="logo">MODEL 3</div>
      <div class="model-badge">2021 LONG RANGE</div>
      
      <div class="systems-list">
        <div class="system-item active" data-system="body">
          <div class="indicator"></div>
          <span>Body & Structure</span>
        </div>
        <div class="system-item" data-system="glass">
          <div class="indicator"></div>
          <span>Glass Roof & Windows</span>
        </div>
        <div class="system-item" data-system="doors">
          <div class="indicator"></div>
          <span>Doors & Closures</span>
        </div>
        <div class="system-item" data-system="cabin">
          <div class="indicator"></div>
          <span>Passenger Cabin</span>
        </div>
        <div class="system-item" data-system="battery">
          <div class="indicator"></div>
          <span>Battery Pack</span>
        </div>
        <div class="system-item" data-system="motors">
          <div class="indicator"></div>
          <span>Dual Motors (AWD)</span>
        </div>
        <div class="system-item" data-system="thermal">
          <div class="indicator"></div>
          <span>Thermal System</span>
        </div>
        <div class="system-item" data-system="suspension">
          <div class="indicator"></div>
          <span>Suspension</span>
        </div>
        <div class="system-item" data-system="wheels">
          <div class="indicator"></div>
          <span>Wheels & Brakes</span>
        </div>
        <div class="system-item" data-system="charging">
          <div class="indicator"></div>
          <span>Charging & HV</span>
        </div>
        <div class="system-item" data-system="electronics">
          <div class="indicator"></div>
          <span>Computers & 12V</span>
        </div>
        <div class="system-item" data-system="lighting">
          <div class="indicator"></div>
          <span>Exterior Lighting</span>
        </div>
      </div>
      
      <div class="disclaimer">
        Educational recreation — not affiliated with Tesla, Inc.
      </div>
    </aside>
    
    <main class="viewport">
      <div id="canvas-container"></div>
      
      <div class="controls-bottom">
        <div class="explode-control">
          <label>EXPLODE VIEW</label>
          <input type="range" id="explode-slider" min="0" max="100" value="0">
          <div class="slider-labels">
            <span>Assembled</span>
            <span>Exploded</span>
          </div>
        </div>
      </div>
      
      <div id="detail-card" class="detail-card hidden">
        <h3 id="card-title"></h3>
        <p id="card-description"></p>
        <div class="card-specs" id="card-specs"></div>
      </div>
    </main>
  </div>
  
  <script type="module" src="/main.js"></script>
</body>
</html>
