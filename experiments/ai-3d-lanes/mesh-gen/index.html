<!doctype html>
<html lang="en" data-study="material" data-app="mesh-gen">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A closer look. — vibes</title></head>
<body data-mode="mesh">
<header><span class="brand">Vibes / asset studies</span><span>Local file preview</span></header>
<main id="viewport" aria-label="Interactive 3D preview"></main>
<aside><p class="kicker">Mesh inspector</p><h1>A closer look.</h1><p>Open a GLB model, inspect its mesh, and find the right angle.</p>
<label class="file-button">Open GLB<input id="file" type="file" accept=".glb"></label>
<p id="status" role="status">Sample loaded. Drop a file on the preview to begin.</p>
<label>Roughness<input id="roughness" type="range" min="0" max="1" step=".01" value=".45"></label>
<label class="relief-only">Relief depth<input id="amount" type="range" min="0" max="1" step=".01" value=".35"></label>
<label><input id="wireframe" type="checkbox"> Show wireframe</label>
<label><input id="spin" type="checkbox"> Rotate slowly</label>
<button id="reset">Reset view</button><button id="save" class="secondary">Save image</button>
<p class="note">Drag to orbit · scroll to zoom.<br>Files stay in your browser. No account or generation service required.</p></aside>
<script type="module" src="/main.js"></script></body></html>
