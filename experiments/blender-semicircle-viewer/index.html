<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semicircle Laptop Array — Blender MCP Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      overflow: hidden;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 2rem;
      pointer-events: none;
      z-index: 10;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .subtitle {
      font-size: 1.1rem;
      opacity: 0.7;
      font-weight: 400;
    }

    .badge {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      font-size: 0.9rem;
      backdrop-filter: blur(10px);
    }

    #controls {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1rem;
      pointer-events: all;
      background: rgba(20, 20, 20, 0.8);
      padding: 1rem 1.5rem;
      border-radius: 50px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    button {
      padding: 0.75rem 1.5rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      color: #e0e0e0;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    button.active {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.5);
    }

    #info {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      padding: 1rem;
      background: rgba(20, 20, 20, 0.8);
      border-radius: 10px;
      backdrop-filter: blur(10px);
      font-size: 0.85rem;
      opacity: 0.6;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }
      #controls {
        flex-direction: column;
        bottom: 1rem;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div id="ui-overlay">
    <h1>Semicircle Laptop Array</h1>
    <p class="subtitle">51 procedural laptop-like objects • Blender MCP workflow demo</p>
    <div class="badge">Inspired by Legendaryy's Blender MCP</div>
  </div>

  <div id="controls">
    <button id="btn-rotate" class="active">Auto-Rotate</button>
    <button id="btn-reset">Reset Camera</button>
  </div>

  <div id="info">
    <div>Drag to orbit • Scroll to zoom</div>
    <div>Procedural geometry • No Apple assets</div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
