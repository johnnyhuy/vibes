<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semicircle Laptop Array — Blender MCP Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #f4f4f5;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    #ui-overlay {
      position: fixed;
      top: 1.3rem;
      left: 1.5rem;
      pointer-events: none;
      z-index: 10;
      max-width: 22rem;
    }

    .kicker {
      font-size: 0.64rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.42);
    }

    h1 {
      margin-top: 0.3rem;
      font-size: clamp(1.6rem, 3vw, 2.1rem);
      font-weight: 600;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin-top: 0.45rem;
      font-size: 0.86rem;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 300;
    }

    .badge {
      display: inline-block;
      margin-top: 0.85rem;
      padding: 0.28rem 0.7rem;
      background: rgba(8, 10, 14, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      backdrop-filter: blur(14px);
    }

    #controls {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.5rem;
      pointer-events: all;
      background: rgba(8, 10, 14, 0.48);
      padding: 0.55rem 0.65rem;
      border-radius: 999px;
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    button {
      padding: 0.45rem 0.95rem;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.75rem;
      cursor: pointer;
    }

    button:hover,
    button.active {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.08);
    }

    #info {
      position: fixed;
      left: 1.5rem;
      bottom: 1.25rem;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .subtitle {
        display: none;
      }
      #info {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div id="ui-overlay">
    <p class="kicker">Blender MCP · clean-room</p>
    <h1>Semicircle array</h1>
    <p class="subtitle">51 procedural laptop-like objects in a 180° XZ horseshoe. Framed with margin — not a cropped mega-arc.</p>
    <div class="badge">No Apple assets</div>
  </div>

  <div id="controls">
    <button id="btn-rotate" class="active">Auto-Rotate</button>
    <button id="btn-reset">Reset Camera</button>
  </div>

  <div id="info">
    Drag to orbit · scroll to zoom · procedural only
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
