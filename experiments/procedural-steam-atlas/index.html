<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Steam Atlas - Runtime Geometry</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      overflow: hidden;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #controls {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(10, 10, 10, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 20px;
      min-width: 280px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 16px;
    }

    .control-group {
      margin-bottom: 16px;
    }

    .control-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .button-group {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    button.active {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    input[type="range"] {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      border-radius: 2px;
      appearance: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      background: #ffffff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: #ffffff;
      border-radius: 50%;
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .slider-value {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 6px;
      text-align: right;
    }

    #info {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      max-width: 400px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="controls">
    <h1>Procedural Steam Atlas</h1>
    <p class="subtitle">Runtime geometry — no assets</p>

    <div class="control-group">
      <label>View Mode</label>
      <div class="button-group">
        <button id="btn-assembled" class="active">Assembled</button>
        <button id="btn-exploded">Exploded</button>
      </div>
    </div>

    <div class="control-group">
      <label>Explosion Level</label>
      <input type="range" id="explosion-slider" min="0" max="100" value="0">
      <div class="slider-value">0%</div>
    </div>

    <div class="control-group">
      <label>Isolation</label>
      <div class="button-group">
        <button id="btn-all" class="active">All</button>
        <button id="btn-chassis">Chassis</button>
        <button id="btn-wheels">Wheels</button>
      </div>
    </div>
  </div>

  <div id="info">
    Inspired by Steam Atlas mechanical patterns. All geometry generated at runtime from TypeScript functions — no .glb, .obj, or image assets. Drag to orbit, scroll to zoom.
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
