<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Steam Atlas - Runtime Geometry</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #f4f4f5;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    .plaque,
    .editorial,
    #controls,
    #info {
      z-index: 10;
    }

    .plaque {
      position: fixed;
      top: 1.3rem;
      left: 1.5rem;
      pointer-events: none;
    }

    .plaque span {
      display: block;
      font-size: 0.64rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.42);
    }

    .plaque h1 {
      margin-top: 0.28rem;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.14em;
    }

    .editorial {
      position: fixed;
      top: 5.2rem;
      left: 1.5rem;
      max-width: 20rem;
      pointer-events: none;
    }

    .editorial h2 {
      font-size: clamp(1.7rem, 3vw, 2.2rem);
      font-weight: 560;
      letter-spacing: -0.035em;
    }

    .editorial p {
      margin-top: 0.6rem;
      font-size: 0.88rem;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.52);
      font-weight: 300;
    }

    #controls {
      position: fixed;
      left: 50%;
      bottom: 1.2rem;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 1.1rem;
      min-width: min(40rem, calc(100% - 2rem));
      padding: 0.75rem 1rem;
      border-radius: 999px;
      background: rgba(8, 10, 14, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .control-group.grow {
      flex: 1;
      min-width: 8rem;
    }

    label {
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
    }

    .button-group {
      display: flex;
      gap: 0.3rem;
    }

    button {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.7);
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.72rem;
    }

    button.active,
    button:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.08);
    }

    input[type="range"] {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.18);
      outline: none;
      border-radius: 2px;
      appearance: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 13px;
      height: 13px;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      background: #fff;
      border: none;
      border-radius: 50%;
    }

    .slider-value {
      font-size: 0.68rem;
      color: rgba(255, 255, 255, 0.7);
      font-variant-numeric: tabular-nums;
    }

    .slider-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #info {
      position: fixed;
      left: 1.5rem;
      bottom: 5.4rem;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      max-width: 22rem;
    }

    @media (max-width: 800px) {
      .editorial,
      #info {
        display: none;
      }

      #controls {
        flex-wrap: wrap;
        border-radius: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <header class="plaque">
    <span>A study in motion</span>
    <h1>Steam Atlas</h1>
  </header>

  <section class="editorial">
    <h2>Engineering in motion.</h2>
    <p>A locomotive drawn from primitives — boiler, cab, wheels, rivets. No .glb. Explode it, isolate a system, then put it back together.</p>
  </section>

  <div id="controls">
    <div class="control-group">
      <label>View</label>
      <div class="button-group">
        <button id="btn-assembled" class="active">Assembled</button>
        <button id="btn-exploded">Exploded</button>
      </div>
    </div>

    <div class="control-group grow">
      <div class="slider-head">
        <label for="explosion-slider">Explode</label>
        <div class="slider-value">0%</div>
      </div>
      <input type="range" id="explosion-slider" min="0" max="100" value="0">
    </div>

    <div class="control-group">
      <label>Isolation</label>
      <div class="button-group">
        <button id="btn-all" class="active">All</button>
        <button id="btn-chassis">Chassis</button>
        <button id="btn-wheels">Wheels</button>
      </div>
    </div>
  </div>

  <div id="info">
    Drag to orbit · scroll to zoom · runtime geometry only
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
